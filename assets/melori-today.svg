<svg width="1290" height="2796" viewBox="0 0 1290 2796" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1290" y2="2796" gradientUnits="userSpaceOnUse">
      <stop stop-color="#08111E"/>
      <stop offset="1" stop-color="#0B1628"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1000 330) rotate(123) scale(720 620)">
      <stop stop-color="#00E5FF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#00E5FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="170" y="487" width="950" height="1820" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="28" stdDeviation="35" flood-color="#00E5FF" flood-opacity="0.14"/>
    </filter>
  </defs>
  <rect width="1290" height="2796" fill="url(#bg)"/>
  <rect width="1290" height="2796" fill="url(#glow)"/>
  <circle cx="1080" cy="360" r="220" fill="#00E5FF" fill-opacity="0.06"/>
  <circle cx="170" cy="2350" r="260" fill="#00E5FF" fill-opacity="0.04"/>

  <text x="110" y="220" fill="#FFFFFF" font-size="90" font-family="Avenir Next, Arial, sans-serif" font-weight="700">Know what</text>
  <text x="110" y="320" fill="#FFFFFF" font-size="90" font-family="Avenir Next, Arial, sans-serif" font-weight="700">matters today</text>
  <text x="110" y="402" fill="#8899AA" font-size="40" font-family="Avenir Next, Arial, sans-serif">Melori clears the noise and keeps the day in focus.</text>

  <g filter="url(#shadow)">
    <rect x="210" y="560" width="870" height="1680" rx="72" fill="rgba(13,18,32,0.84)"/>
    <rect x="210" y="560" width="870" height="1680" rx="72" fill="#0D1220"/>
    <rect x="210.5" y="560.5" width="869" height="1679" rx="71.5" stroke="rgba(0,229,255,0.18)"/>
  </g>

  <text x="510" y="670" fill="#00E5FF" font-size="38" font-family="Avenir Next, Arial, sans-serif" font-weight="700">♾ MELORI</text>

  <rect x="358" y="740" width="310" height="74" rx="28" fill="rgba(0,229,255,0.14)"/>
  <text x="440" y="788" fill="#00E5FF" font-size="30" font-family="Avenir Next, Arial, sans-serif" font-weight="700">Today</text>
  <rect x="682" y="740" width="250" height="74" rx="28" fill="rgba(255,255,255,0.04)"/>
  <text x="744" y="788" fill="#4A5A6A" font-size="30" font-family="Avenir Next, Arial, sans-serif" font-weight="700">Tomorrow</text>

  <rect x="270" y="860" width="750" height="144" rx="32" fill="rgba(0,229,255,0.08)" stroke="rgba(0,229,255,0.18)"/>
  <text x="312" y="925" fill="#FFFFFF" font-size="38" font-family="Avenir Next, Arial, sans-serif" font-weight="700">Hi there</text>
  <text x="312" y="972" fill="#8899AA" font-size="27" font-family="Avenir Next, Arial, sans-serif">A health follow-up, one priority thread,</text>
  <text x="312" y="1008" fill="#8899AA" font-size="27" font-family="Avenir Next, Arial, sans-serif">and weather that could change the plan.</text>

  <text x="270" y="1088" fill="#00E5FF" font-size="28" font-family="Avenir Next, Arial, sans-serif" font-weight="700">CALENDAR</text>
  <rect x="270" y="1120" width="750" height="226" rx="28" fill="rgba(255,255,255,0.03)" stroke="rgba(0,229,255,0.12)"/>
  <circle cx="330" cy="1198" r="26" fill="rgba(0,229,255,0.14)" stroke="rgba(0,229,255,0.2)"/>
  <text x="317" y="1208" fill="#00E5FF" font-size="18" font-family="Avenir Next, Arial, sans-serif">9</text>
  <text x="380" y="1188" fill="#FFFFFF" font-size="37" font-family="Avenir Next, Arial, sans-serif" font-weight="700">Doctor follow-up</text>
  <text x="380" y="1234" fill="#8899AA" font-size="28" font-family="Avenir Next, Arial, sans-serif">Bring the prescription questions you flagged.</text>
  <rect x="380" y="1268" width="190" height="40" rx="16" fill="rgba(0,229,255,0.14)"/>
  <text x="418" y="1295" fill="#00E5FF" font-size="20" font-family="Avenir Next, Arial, sans-serif" font-weight="700">Be Ready</text>

  <text x="270" y="1420" fill="#00E5FF" font-size="28" font-family="Avenir Next, Arial, sans-serif" font-weight="700">FAMILY</text>
  <rect x="270" y="1450" width="750" height="244" rx="28" fill="rgba(255,255,255,0.03)" stroke="rgba(0,229,255,0.12)"/>
  <circle cx="330" cy="1528" r="26" fill="rgba(0,229,255,0.14)" stroke="rgba(0,229,255,0.2)"/>
  <text x="318" y="1538" fill="#00E5FF" font-size="18" font-family="Avenir Next, Arial, sans-serif">↗</text>
  <text x="380" y="1518" fill="#FFFFFF" font-size="37" font-family="Avenir Next, Arial, sans-serif" font-weight="700">School form needs reply</text>
  <text x="380" y="1564" fill="#8899AA" font-size="27" font-family="Avenir Next, Arial, sans-serif">Melori thinks this matters before</text>
  <text x="380" y="1600" fill="#8899AA" font-size="27" font-family="Avenir Next, Arial, sans-serif">the day gets fragmented.</text>
  <rect x="380" y="1630" width="214" height="40" rx="16" fill="rgba(255,255,255,0.04)"/>
  <text x="414" y="1657" fill="#FFFFFF" font-size="20" font-family="Avenir Next, Arial, sans-serif" font-weight="700">Reply Matters</text>

  <text x="270" y="1768" fill="#00E5FF" font-size="28" font-family="Avenir Next, Arial, sans-serif" font-weight="700">WEATHER</text>
  <rect x="270" y="1798" width="750" height="208" rx="28" fill="rgba(255,255,255,0.03)" stroke="rgba(0,229,255,0.12)"/>
  <text x="320" y="1884" fill="#FFFFFF" font-size="34" font-family="Avenir Next, Arial, sans-serif" font-weight="700">Rain could slow the afternoon</text>
  <text x="320" y="1930" fill="#8899AA" font-size="28" font-family="Avenir Next, Arial, sans-serif">Weather only appears when it changes your day.</text>

  <rect x="270" y="2090" width="750" height="110" rx="28" fill="rgba(255,255,255,0.04)" stroke="rgba(0,229,255,0.12)"/>
  <text x="336" y="2158" fill="#4A5A6A" font-size="25" font-family="Avenir Next, Arial, sans-serif">✉ Inbox Zero</text>
  <text x="535" y="2158" fill="#4A5A6A" font-size="25" font-family="Avenir Next, Arial, sans-serif">📅 Planner</text>
  <text x="720" y="2158" fill="#4A5A6A" font-size="25" font-family="Avenir Next, Arial, sans-serif">🎯 Focus</text>
  <rect x="862" y="2108" width="116" height="72" rx="24" fill="rgba(0,229,255,0.14)" stroke="rgba(0,229,255,0.32)"/>
  <text x="885" y="2158" fill="#00E5FF" font-size="24" font-family="Avenir Next, Arial, sans-serif" font-weight="700">⌕ Ask</text>

  <text x="110" y="2480" fill="#FFFFFF" font-size="42" font-family="Avenir Next, Arial, sans-serif" font-weight="700">Not another planner. A calmer answer.</text>
  <text x="110" y="2542" fill="#8899AA" font-size="32" font-family="Avenir Next, Arial, sans-serif">Melori helps busy people see what matters right now.</text>
</svg>
