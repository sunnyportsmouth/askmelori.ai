<svg width="1290" height="2796" viewBox="0 0 1290 2796" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1290" y2="2796" gradientUnits="userSpaceOnUse">
      <stop stop-color="#08111E"/>
      <stop offset="1" stop-color="#0B1628"/>
    </linearGradient>
  </defs>
  <rect width="1290" height="2796" fill="url(#bg)"/>
  <circle cx="1070" cy="320" r="240" fill="#00E5FF" fill-opacity="0.08"/>
  <circle cx="185" cy="2280" r="240" fill="#00E5FF" fill-opacity="0.04"/>

  <text x="110" y="220" fill="#FFFFFF" font-size="90" font-family="Avenir Next, Arial, sans-serif" font-weight="700">Ask naturally.</text>
  <text x="110" y="320" fill="#FFFFFF" font-size="90" font-family="Avenir Next, Arial, sans-serif" font-weight="700">Act quickly.</text>
  <text x="110" y="402" fill="#8899AA" font-size="38" font-family="Avenir Next, Arial, sans-serif">A conversation-first workspace for planning,</text>
  <text x="110" y="448" fill="#8899AA" font-size="38" font-family="Avenir Next, Arial, sans-serif">drafting, and getting things done.</text>

  <rect x="205" y="560" width="880" height="1710" rx="76" fill="#0D1220" stroke="rgba(0,229,255,0.18)"/>
  <text x="500" y="670" fill="#00E5FF" font-size="38" font-family="Avenir Next, Arial, sans-serif" font-weight="700">♾ MELORI</text>
  <text x="270" y="792" fill="#FFFFFF" font-size="60" font-family="Avenir Next, Arial, sans-serif" font-weight="800">Melori</text>
  <text x="270" y="848" fill="#8899AA" font-size="29" font-family="Avenir Next, Arial, sans-serif">I can help turn this into a cleaner next step.</text>

  <rect x="270" y="930" width="326" height="58" rx="22" fill="rgba(255,255,255,0.04)" stroke="rgba(0,229,255,0.14)"/>
  <text x="308" y="968" fill="#FFFFFF" font-size="22" font-family="Avenir Next, Arial, sans-serif" font-weight="700">Draft a reply</text>
  <rect x="610" y="930" width="260" height="58" rx="22" fill="rgba(255,255,255,0.04)" stroke="rgba(0,229,255,0.14)"/>
  <text x="649" y="968" fill="#FFFFFF" font-size="22" font-family="Avenir Next, Arial, sans-serif" font-weight="700">Help me decide</text>

  <rect x="270" y="1050" width="420" height="178" rx="28" fill="rgba(0,229,255,0.14)" stroke="rgba(0,229,255,0.24)"/>
  <text x="304" y="1124" fill="#FFFFFF" font-size="30" font-family="Avenir Next, Arial, sans-serif">Can you draft a reply</text>
  <text x="304" y="1166" fill="#FFFFFF" font-size="30" font-family="Avenir Next, Arial, sans-serif">and remind me if I do not</text>
  <text x="304" y="1208" fill="#FFFFFF" font-size="30" font-family="Avenir Next, Arial, sans-serif">send it today?</text>

  <rect x="465" y="1276" width="560" height="320" rx="28" fill="rgba(255,255,255,0.03)" stroke="rgba(0,229,255,0.12)"/>
  <text x="505" y="1358" fill="#00E5FF" font-size="24" font-family="Avenir Next, Arial, sans-serif" font-weight="700">MELORI</text>
  <text x="505" y="1426" fill="#FFFFFF" font-size="34" font-family="Avenir Next, Arial, sans-serif" font-weight="700">I can help with both.</text>
  <text x="505" y="1482" fill="#8899AA" font-size="27" font-family="Avenir Next, Arial, sans-serif">Would you like the tone to stay warm and brief,</text>
  <text x="505" y="1520" fill="#8899AA" font-size="27" font-family="Avenir Next, Arial, sans-serif">or a bit more formal?</text>
  <rect x="505" y="1552" width="128" height="46" rx="18" fill="rgba(0,229,255,0.14)"/>
  <text x="546" y="1582" fill="#00E5FF" font-size="22" font-family="Avenir Next, Arial, sans-serif" font-weight="700">Draft</text>
  <rect x="650" y="1552" width="160" height="46" rx="18" fill="rgba(255,255,255,0.04)"/>
  <text x="691" y="1582" fill="#FFFFFF" font-size="22" font-family="Avenir Next, Arial, sans-serif" font-weight="700">Reminder</text>

  <rect x="270" y="1650" width="755" height="246" rx="28" fill="rgba(255,255,255,0.03)" stroke="rgba(0,229,255,0.12)"/>
  <text x="310" y="1722" fill="#00E5FF" font-size="24" font-family="Avenir Next, Arial, sans-serif" font-weight="700">DRAFT PREVIEW</text>
  <text x="310" y="1790" fill="#FFFFFF" font-size="29" font-family="Avenir Next, Arial, sans-serif">Hi, thanks for sending this over.</text>
  <text x="310" y="1832" fill="#FFFFFF" font-size="29" font-family="Avenir Next, Arial, sans-serif">Monday morning works well on my side...</text>

  <rect x="270" y="1982" width="755" height="170" rx="28" fill="rgba(255,255,255,0.03)" stroke="rgba(0,229,255,0.12)"/>
  <text x="320" y="2085" fill="#4A5A6A" font-size="28" font-family="Avenir Next, Arial, sans-serif">Tell Melori anything</text>
  <circle cx="928" cy="2069" r="34" fill="#00E5FF"/>
  <text x="917" y="2082" fill="#07111D" font-size="26" font-family="Avenir Next, Arial, sans-serif" font-weight="700">→</text>

  <text x="110" y="2480" fill="#FFFFFF" font-size="42" font-family="Avenir Next, Arial, sans-serif" font-weight="700">The shortest path to action should feel human.</text>
  <text x="110" y="2542" fill="#8899AA" font-size="32" font-family="Avenir Next, Arial, sans-serif">Intent first. Tools second. Context already in the room.</text>
</svg>
